<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Rigor Salary — Negotiation Helper</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/styles.css"/>
  <!-- SEO & Social -->
  <meta name="description" content="Get a personalized salary negotiation strategy with exact scripts, market data, and tactics." />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://rigor.design/salary" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://rigor.design/salary" />
  <meta property="og:title" content="Rigor Salary — Negotiation Helper" />
  <meta property="og:description" content="Get a personalized salary negotiation strategy with exact scripts, market data, and tactics." />
  <meta property="og:image" content="https://rigor.design/og-image.png" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Rigor Salary — Negotiation Helper" />
  <meta name="twitter:description" content="Get a personalized salary negotiation strategy with exact scripts, market data, and tactics." />
  <meta name="twitter:image" content="https://rigor.design/og-image.png" />

  <!-- Theme color -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#1E3A5F" />
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>
    <nav class="nav" aria-label="Main navigation">
    <a href="/" class="nav-brand">rigor<span>.</span>design</a>
    <div class="nav-links"><span class="plan-badge hidden" id="plan-badge"></span><a href="#" id="nav-login" class="nav-link">Sign In</a><button class="btn-upgrade-nav" id="nav-upgrade" class="btn-upgrade-nav nav-upgrade-hidden">⚡ Upgrade</button><button class="btn-icon" id="nav-manage" class="btn-icon nav-manage-hidden">Manage Plan</button><a href="#" id="nav-signup" class="btn-nav">Get Started</a></div>
  </nav>
  <div class="modal-overlay hidden" id="auth-modal" role="dialog" aria-modal="true" aria-labelledby="auth-modal-title">
    <div class="modal">
      <button class="modal-close" id="modal-close" aria-label="Close dialog">&times;</button>
      <div class="modal-tabs"><button class="tab-btn active" data-tab="login">Sign In</button><button class="tab-btn" data-tab="signup">Sign Up</button></div>
      <div class="tab-content" id="tab-login"><input type="email" class="input" id="login-email" placeholder="Email"/><input type="password" class="input" id="login-password" placeholder="Password"/><button class="btn-primary full" id="btn-login" aria-label="Sign in to your account">Sign In</button></div>
      <div class="tab-content hidden" id="tab-signup"><input type="text" class="input" id="signup-name" placeholder="Full Name"/><input type="email" class="input" id="signup-email" placeholder="Email"/><input type="password" class="input" id="signup-password" placeholder="Password"/><button class="btn-primary full" id="btn-signup" aria-label="Create a new account">Create Account</button></div>
      <p class="auth-error hidden" id="auth-error"></p>
    </div>
  </div>

  <section class="hero" id="main-content">
    <div class="hero-badge">Salary Negotiation Helper</div>
    <h1 class="hero-title">Negotiate Your Worth.<br/><em>Get Paid What You Deserve.</em></h1>
    <p class="hero-sub">Enter your offer details and experience. Get a personalized negotiation strategy with exact scripts.</p>
  </section>

  <section class="tool-section" aria-label="Main tool"><div id="usage-meter-container"></div>
    <div class="tool-container">
      <div class="two-col">
        <div class="tool-panel">
          <div class="panel-header"><span class="panel-num">01</span><h2>The Offer</h2></div>
          <label class="field-label">Job Title</label>
          <input type="text" class="input" id="job-title" placeholder="e.g. Senior Software Engineer"/>
          <label class="field-label">Company</label>
          <input type="text" class="input" id="company" placeholder="Company name"/>
          <label class="field-label">Offered Salary</label>
          <input type="text" class="input" id="offered-salary" placeholder="e.g. $120,000"/>
          <label class="field-label">Location</label>
          <input type="text" class="input" id="location" placeholder="e.g. New York, NY or Remote"/>
          <label class="field-label">Benefits Offered</label>
          <textarea class="input textarea" id="benefits" placeholder="List any benefits: 401k match, equity, PTO, etc."></textarea>
        </div>
        <div class="tool-panel">
          <div class="panel-header"><span class="panel-num">02</span><h2>Your Background</h2></div>
          <label class="field-label">Years of Experience</label>
          <input type="number" class="input" id="years-exp" placeholder="e.g. 7"/>
          <label class="field-label">Current Salary</label>
          <input type="text" class="input" id="current-salary" placeholder="e.g. $105,000 (optional)"/>
          <label class="field-label">Target Salary</label>
          <input type="text" class="input" id="target-salary" placeholder="e.g. $140,000"/>
          <label class="field-label">Competing Offers</label>
          <input type="text" class="input" id="competing" placeholder="e.g. $135k from Google (optional)"/>
          <label class="field-label">Key Achievements</label>
          <textarea class="input textarea" id="achievements" placeholder="Your top 3 achievements to leverage..."></textarea>
        </div>
      </div>

      <div class="tool-actions">
        <button class="btn-primary large" id="btn-generate" aria-label="Generate content"><span class="btn-text">Build My Negotiation Strategy</span><span class="btn-loader hidden">Analyzing market data...</span></button>
      </div>

      <div class="results hidden" id="results">
        <div class="salary-range-card" id="salary-range-card"></div>
        <div class="strategy-sections" id="strategy-sections"></div>
        <button class="btn-secondary" id="btn-save" aria-label="Save result">Save Strategy</button>
      </div>
    </div>
  </section>

  <footer class="footer"><p>© 2025 rigor.design</p></footer>
  <script type="module" src="js/app.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
